# One alias list for PowerShell and zsh.
#   name = command
# Plain words only: no quotes, pipes or shell variables, so both shells read it the same way.
# An alias is skipped on machines where its command isn't installed.

ll = eza -l --git --group-directories-first
la = eza -la --git --group-directories-first
lt = eza --tree --level 2 --group-directories-first

g = git
gs = git status -sb
gd = git diff
glog = git log --oneline --graph -20

.. = cd ..
... = cd ../..
