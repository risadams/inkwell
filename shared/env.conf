# Environment variables set in both PowerShell and zsh.
#   NAME=value
# Values are taken literally (no quoting, no variable expansion).

# fzf: inline picker under the prompt, coloured from the terminal's own 16 colours
# so it follows Ink Parchment and Ink Paper without a second palette.
FZF_DEFAULT_OPTS=--height=40% --layout=reverse --info=inline --color=16,hl:1,hl+:1,pointer:1,prompt:4,info:8,marker:5,bg+:-1,gutter:-1

# bat: use the terminal's colours instead of a baked-in theme.
BAT_THEME=ansi
